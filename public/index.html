<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Savanna Lodge — Bar, Restaurant &amp; Lodging POS</title>
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#101828;--mu:#667085;--bd:#e4e7ec;--pr:#1d4ed8;--prb:#1d4ed8;--ok:#067647;--bad:#b42318;--wn:#b54708;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c2e;--tx:#e8edf7;--mu:#98a2b3;--bd:#26324a;--pr:#6b8cff;--prb:#4361ee;--ok:#32d583;--bad:#f97066;--wn:#fdb022}}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--tx:#e8edf7;--mu:#98a2b3;--bd:#26324a;--pr:#6b8cff;--prb:#4361ee;--ok:#32d583;--bad:#f97066;--wn:#fdb022}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap}main{padding:14px;max-width:1200px;margin:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px}
button{cursor:pointer}button.p{background:var(--prb);color:#fff;border-color:var(--prb)}button.d{color:var(--bad)}button.on{background:var(--prb);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pr);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:13px}.muted{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>div{display:flex;flex-direction:column;gap:3px}
label{font-size:12px;color:var(--mu)}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mu);font-weight:600}
.prod{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.prod button{text-align:left;min-height:64px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.two{display:grid;gap:14px;grid-template-columns:2fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}
.warn{background:#fffaeb;color:#7a2e0e;border:1px solid #fedf89;border-radius:10px;padding:8px 12px;font-size:13px}
#login{max-width:380px;margin:12vh auto}
details>summary{cursor:pointer;list-style-position:inside}details[open]>summary{margin-bottom:8px}
/* ===== Display mode (Auto / PC / Phone) — same system as Mama Justo ===== */
:root{--bn:60px}.bnav,.sheetwrap{display:none}
.dm{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(127,140,170,.18);border:1px solid rgba(127,140,170,.35)}
.dm button{border:0;background:transparent;color:inherit;font-weight:700;font-size:12px;min-height:32px;padding:5px 11px;border-radius:9px}
.dm button[aria-pressed=true]{background:#fff;color:#0a1f4d;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dm.full{display:flex;width:100%}.dm.full button{flex:1;min-height:44px;font-size:14px;color:var(--tx)}.dm.full button[aria-pressed=true]{background:var(--prb);color:#fff}
html.dm-phone{overflow-x:hidden;-webkit-text-size-adjust:100%}html.dm-phone #app{max-width:560px;margin:0 auto;overflow-x:clip}
html.dm-phone header{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;flex-wrap:nowrap}html.dm-phone header h1{font-size:14px;white-space:nowrap}html.dm-phone header small,html.dm-phone .hd-user,html.dm-phone header .dm,html.dm-phone nav{display:none}
html.dm-phone header button{min-width:44px;min-height:44px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff}html.dm-phone header button[aria-label='Log out']{display:none}/* Log out lives in the More sheet on phones */
html.dm-phone main{padding:10px 10px calc(var(--bn) + env(safe-area-inset-bottom,0px) + 28px)}html.dm-phone .card{border-radius:16px}
html.dm-phone .two{grid-template-columns:1fr}html.dm-phone .grid{grid-template-columns:repeat(2,minmax(0,1fr))}html.dm-phone .prod{grid-template-columns:repeat(2,minmax(0,1fr))}
html.dm-phone .row>div{flex:1 1 100%}html.dm-phone .row{align-items:stretch}html.dm-phone input:not([type=checkbox]):not([type=radio]),html.dm-phone select,html.dm-phone textarea{font-size:16px;min-height:46px;width:100%}
html.dm-phone button{min-height:44px;min-width:44px}html.dm-phone .stick{position:sticky;bottom:calc(var(--bn) + env(safe-area-inset-bottom,0px) + 8px);z-index:40;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;gap:8px}html.dm-phone .stick .p{flex:1;min-height:50px;font-size:16px}
html.dm-phone .tw{overflow-x:visible}html.dm-phone table tr:has(th){display:none}html.dm-phone table,html.dm-phone tbody{display:block}html.dm-phone tr{display:block;border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:6px 10px}
html.dm-phone td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:right}html.dm-phone td::before{content:attr(data-label);color:var(--mu);font-weight:600;text-align:left}html.dm-phone td:empty{display:none}
html.dm-phone .bnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:900;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:transparent;min-height:52px;padding:2px 0;font-size:10.5px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px}.bnav .ic{font-size:20px;line-height:1}.bnav button.cur{color:var(--pr);background:rgba(79,107,255,.12)}
html.dm-phone .sheetwrap.open{display:block}.sheetwrap .back{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:1000}
.sheetwrap .panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:1001;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheetwrap .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}.sheetwrap .mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheetwrap .mg button{min-height:50px;text-align:left;font-weight:700}
@media print{header,nav,button{display:none}}

/* ===== additions for the server-backed version ===== */
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{max-width:440px;width:100%;max-height:92vh;overflow:auto;margin:0}.modal .fld{display:flex;flex-direction:column;gap:3px;margin:0 0 10px}.modal .fld input,.modal .fld select{width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:3000;max-width:min(92vw,520px);padding:10px 16px;border-radius:12px;font-size:14px;background:var(--card);border:1px solid var(--bd);box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
#toast.show{display:block}#toast.bad{border-color:var(--bad);color:var(--bad);font-weight:600}#toast.ok{border-color:var(--ok);color:var(--ok)}
body.busy{cursor:progress}body.busy button{pointer-events:none;opacity:.7}
code{font-size:12px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body></html>
